<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;padding:0;margin:0}
html,body{max-width:100vw;overflow-x:hidden;background-color:bisque}

/* header (sticky, 15%) */
.hcontainer{margin:auto;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;background-color:#fcfcfc;height:15%;border-bottom:1px solid #dedede}

/* page */
.page{display:flex;gap:24px;padding:24px;min-height:calc(100vh - 15%)}
.left_block{width:25%;min-width:320px;max-width:480px;overflow-y:auto;max-height:calc(100vh - 15%);padding-right:6px}
.map_block{flex:1;min-width:0;display:flex;position:relative;max-height:calc(100vh - 15%)}

/* card */
.card_container{--card-w:416px;--frame:11px;--radius:26px;--radius-media:15px;margin-top:10px;width:min(var(--card-w),100%);padding:var(--frame);border-radius:var(--radius);background:#fff;box-shadow:0 1px 2px rgba(17,21,30,.05),0 26px 50px -20px rgba(17,21,30,.32)}
.card_link{display:block;width:100%}
.card_media{position:relative;aspect-ratio:1/1;border-radius:15px;overflow:hidden;background:#21221f}

/* map */
.mapWrap{position:relative;width:100%;height:100%}
.map{position:absolute;width:100%;height:100%;background:#b9dcff}
</style></head>
<body>
<div class="hcontainer"></div>
<main class="page">
  <div class="left_block" id="lb"></div>
  <section class="map_block" id="mb">
    <div class="mapWrap"><div class="map" id="map"></div></div>
  </section>
</main>
<pre id="out"></pre>
<script>
function card(){const d=document.createElement('div');d.className='card_container';d.innerHTML='<div class="card_link"><div class="card_media"></div></div>';return d}
function re(id){const b=document.getElementById(id).getBoundingClientRect();return {x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height)}}
function run(){
  const lb=document.getElementById('lb');
  const results={};
  for(const n of [1,2,3,5]){
    lb.innerHTML='';for(let i=0;i<n;i++)lb.appendChild(card());
    void document.body.offsetHeight; // force reflow
    results['cards_'+n]={map_block:re('mb'),map:re('map'),left_block:re('lb')};
  }
  document.getElementById('out').textContent='MEASURED '+JSON.stringify(results);
}
window.addEventListener('load',()=>setTimeout(run,50));
</script>
</body></html>
